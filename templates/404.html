<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Η σελίδα δεν βρέθηκε | BIOMED Samos</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/landing.css') }}?v=2">
    <link rel="icon" type="image/jpeg" href="/static/images/fav.jpg">
    <style>
        .not-found {
            min-height: calc(100vh - 72px - 72px);
            display: flex;
            align-items: center;
            background: var(--color-soft);
        }

        .not-found__inner {
            text-align: center;
            padding: 80px 20px;
        }

        .not-found__code {
            font-family: "Geologica", sans-serif;
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--color-primary);
            margin-bottom: 16px;
        }

        .not-found h1 {
            margin-bottom: 16px;
        }

        .not-found__text {
            color: var(--color-muted);
            max-width: 520px;
            margin: 0 auto 32px;
            font-size: 16px;
        }

        .not-found .btn-primary {
            background: linear-gradient(135deg, #d71920, #ff3b3f);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
        }

        .not-found .btn-primary:hover {
            transform: translateY(-2px);
        }

        .page-404 .footer {
            padding: 24px 0;
        }

        .page-404 .footer-bottom {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .not-found__code {
                font-size: 88px;
            }
        }
    </style>
</head>
<body class="page-404">

<nav class="navbar">
    <div class="container navbar__inner">
        <a href="/" class="logo">
            <img src="{{ url_for('static', path='images/logo.png') }}" alt="BIOMED Samos">
        </a>
    </div>
</nav>

<main class="not-found">
    <div class="container not-found__inner">
        <p class="not-found__code">404</p>
        <h1>Η σελίδα δεν βρέθηκε</h1>
        <p class="not-found__text">Η διεύθυνση που επισκεφθήκατε ενδέχεται να έχει αλλάξει ή να μην είναι πλέον διαθέσιμη.</p>
        <a href="/" class="btn btn-primary">Επιστροφή στην αρχική</a>
    </div>
</main>

<footer class="footer">
    <div class="footer-bottom">
        © 2026 BIOMED Samos
    </div>
</footer>

</body>
</html>
